# Sales Pipeline Agent — Configuration
# Generated by Agent Builder from domain_spec.md

agent_id: sales-pipeline-v1
name: Sales Pipeline Agent
version: "1.0.0"
domain: sales_pipeline

stratus:
  model_version: v6
  sidecar_url: "http://127.0.0.1:7900"

llm:
  provider: anthropic
  model: claude-sonnet-4-6
  max_tokens: 4096
  temperature: 0.3

brain:
  type: stratus
  max_steps_per_turn: 8
  goal_proximity_threshold: 0.85
  recovery:
    max_consecutive_failures: 2
    strategy: retry_then_escalate

probe:
  primary: sales-pipeline-v1
  fallback: planning-v1
  cascade_strategy: primary_with_fallback

training:
  domains:
    - sales_pipeline
    - crm_management
    - email_outreach
    - lead_qualification
    - meeting_scheduling

integrations:
  crm:
    required: true
    auth_type: oauth
    env_var: CRM_OAUTH_TOKEN
    providers: ["salesforce", "hubspot"]
  email:
    required: true
    auth_type: oauth
    env_var: EMAIL_OAUTH_TOKEN
    providers: ["gmail", "outlook"]
  calendar:
    required: true
    auth_type: oauth
    env_var: CALENDAR_OAUTH_TOKEN
  linkedin:
    required: false
    auth_type: api_key
    env_var: LINKEDIN_API_KEY
  slack:
    required: false
    auth_type: bot_token
    env_var: SLACK_BOT_TOKEN

channels:
  - type: api
    enabled: true
  - type: slack
    enabled: true
    config:
      default_channel: "#sales-alerts"
