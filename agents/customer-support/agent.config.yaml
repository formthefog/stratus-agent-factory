# Customer Support Agent — Configuration
# Generated by Agent Builder from domain_spec.md

agent_id: customer-support-v1
name: Customer Support Agent
version: "1.0.0"
domain: customer_support

stratus:
  model_version: v6
  sidecar_url: "http://127.0.0.1:7900"

llm:
  provider: anthropic
  model: claude-sonnet-4-6
  max_tokens: 4096
  temperature: 0.2

brain:
  type: stratus
  max_steps_per_turn: 10
  goal_proximity_threshold: 0.85
  recovery:
    max_consecutive_failures: 2
    strategy: escalate

probe:
  primary: customer-support-v1
  fallback: planning-v1
  cascade_strategy: primary_with_fallback

training:
  domains:
    - customer_support
    - ticket_management
    - knowledge_base_search
    - billing_operations
    - customer_communication

integrations:
  ticketing:
    required: true
    auth_type: api_key
    env_var: TICKETING_API_KEY
    providers: ["zendesk", "intercom"]
  knowledge_base:
    required: true
    auth_type: internal_api
    env_var: KB_API_KEY
  email:
    required: true
    auth_type: smtp
    env_vars:
      - SMTP_HOST
      - SMTP_USER
      - SMTP_PASS
  product_api:
    required: true
    auth_type: internal_api
    env_var: PRODUCT_API_KEY
  slack:
    required: false
    auth_type: bot_token
    env_var: SLACK_BOT_TOKEN

channels:
  - type: api
    enabled: true
  - type: zendesk_webhook
    enabled: true
  - type: intercom_webhook
    enabled: true
  - type: email
    enabled: true
