# Personal Productivity Agent — Configuration
# Generated by Agent Builder from domain_spec.md

agent_id: personal-assistant-v1
name: Personal Productivity Agent
version: "1.0.0"
domain: personal_assistant

stratus:
  model_version: v6
  sidecar_url: "http://127.0.0.1:7900"

llm:
  provider: anthropic
  model: claude-sonnet-4-6
  max_tokens: 4096
  temperature: 0.3

brain:
  type: stratus
  max_steps_per_turn: 8
  goal_proximity_threshold: 0.85
  recovery:
    max_consecutive_failures: 2
    strategy: retry_then_ask

probe:
  primary: personal-assistant-v1
  fallback: planning-v1
  cascade_strategy: primary_with_fallback

training:
  domains:
    - personal_assistant
    - email_management
    - scheduling
    - task_management
    - research_synthesis

integrations:
  calendar:
    required: true
    auth_type: oauth
    env_var: CALENDAR_OAUTH_TOKEN
    providers: ["google", "outlook"]
  email:
    required: true
    auth_type: oauth
    env_var: EMAIL_OAUTH_TOKEN
    providers: ["gmail", "outlook"]
  tasks:
    required: false
    auth_type: api_key
    env_var: TASKS_API_KEY
    providers: ["todoist", "notion"]
  web_search:
    required: false
    auth_type: api_key
    env_var: SEARCH_API_KEY
  slack:
    required: false
    auth_type: bot_token
    env_var: SLACK_BOT_TOKEN

channels:
  - type: api
    enabled: true
  - type: slack
    enabled: true
    config:
      default_channel: "#personal"
  - type: email
    enabled: true
