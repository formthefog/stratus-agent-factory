# DevOps Incident Response Agent — Configuration
# Generated by Agent Builder from domain_spec.md

agent_id: devops-incident-v1
name: DevOps Incident Response Agent
version: "1.0.0"
domain: devops_incident

stratus:
  model_version: v6
  sidecar_url: "http://127.0.0.1:7900"

llm:
  provider: anthropic
  model: claude-sonnet-4-6
  max_tokens: 4096
  temperature: 0.1

brain:
  type: stratus
  max_steps_per_turn: 15
  goal_proximity_threshold: 0.85
  recovery:
    max_consecutive_failures: 3
    strategy: rollback_then_escalate

probe:
  primary: devops-incident-v1
  fallback: planning-v1
  cascade_strategy: primary_with_fallback

training:
  domains:
    - devops_incident
    - infrastructure_management
    - monitoring_observability
    - cloud_operations
    - incident_communication

integrations:
  pagerduty:
    required: true
    auth_type: api_token
    env_var: PAGERDUTY_API_TOKEN
  datadog:
    required: true
    auth_type: api_app_key
    env_vars:
      - DATADOG_API_KEY
      - DATADOG_APP_KEY
  aws:
    required: true
    auth_type: iam_role
    env_var: AWS_ROLE_ARN
  github:
    required: false
    auth_type: personal_access_token
    env_var: GITHUB_TOKEN
  slack:
    required: true
    auth_type: bot_token
    env_var: SLACK_BOT_TOKEN

channels:
  - type: api
    enabled: true
  - type: slack
    enabled: true
    config:
      default_channel: "#ops-alerts"
  - type: pagerduty_webhook
    enabled: true
